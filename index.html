<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITDS Helpdesk Ticketing - Mitra Asa Pratama</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans">

  <!-- LOGIN SCREEN -->
  <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
      <div class="mb-6">
        <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded">Mitra Asa Pratama</span>
        <h1 class="text-2xl font-bold mt-2 text-slate-900">ITDS Helpdesk Portal</h1>
        <p class="text-sm text-slate-500">Masuk menggunakan User ID atau Email kantor Anda.</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">User ID / Email</label>
          <input id="loginUser" type="text" placeholder="contoh: jenius@mitraasa.co.id" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password / PIN</label>
          <input id="loginPass" type="password" placeholder="••••••••" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button id="btnLogin" onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">Masuk ke Portal</button>
        <p id="loginError" class="text-red-600 text-xs text-center"></p>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appView" class="hidden">
    <!-- NAVBAR -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="bg-blue-600 text-white font-bold px-2.5 py-1 rounded-lg text-sm">ITDS</div>
          <div>
            <h1 class="font-bold text-slate-900 text-sm md:text-base">Ticketing System</h1>
            <p class="text-xs text-slate-500">Mitra Asa Pratama</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="text-right hidden sm:block">
            <p id="navName" class="text-sm font-semibold text-slate-800"></p>
            <span id="navRole" class="text-[11px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700"></span>
          </div>
          <button onclick="openNewModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg">+ Buat Tiket</button>
          <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs md:text-sm px-3 py-2 rounded-lg">Keluar</button>
        </div>
      </div>
    </nav>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto p-4 md:p-6">
      <!-- SUMMARY & FILTER -->
      <div class="flex flex-wrap gap-2 mb-5 items-center justify-between">
        <div class="flex flex-wrap gap-1.5" id="filterTabs">
          <button onclick="setFilter('ALL')" class="filter-btn bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-medium">Semua</button>
          <button onclick="setFilter('New')" class="filter-btn bg-white text-slate-600 border px-3 py-1.5 rounded-lg text-xs font-medium">New</button>
          <button onclick="setFilter('In Progress')" class="filter-btn bg-white text-slate-600 border px-3 py-1.5 rounded-lg text-xs font-medium">In Progress</button>
          <button onclick="setFilter('Test & Review')" class="filter-btn bg-white text-slate-600 border px-3 py-1.5 rounded-lg text-xs font-medium">Test & Review</button>
          <button onclick="setFilter('Deployment')" class="filter-btn bg-white text-slate-600 border px-3 py-1.5 rounded-lg text-xs font-medium">Deployment</button>
          <button onclick="setFilter('Done')" class="filter-btn bg-white text-slate-600 border px-3 py-1.5 rounded-lg text-xs font-medium">Done</button>
        </div>
        <button onclick="fetchTickets()" class="text-xs text-blue-600 hover:underline font-medium">↻ Refresh Data</button>
      </div>

      <!-- TICKET LIST -->
      <div id="ticketContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>
  </div>

  <!-- MODAL BUAT TIKET BARU -->
  <div id="newModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg">Buat Tiket Baru</h2>
        <button onclick="closeModal('newModal')" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-semibold mb-1">Modul / Kategori</label>
          <select id="newModul" class="w-full border rounded-lg p-2">
            <option value="SUPPORT">SUPPORT</option>
            <option value="DEVELOPMENT">DEVELOPMENT</option>
            <option value="SYSTEM ANALYST">SYSTEM ANALYST</option>
            <option value="ACCESS RIGHT ODOO">ACCESS RIGHT ODOO</option>
            <option value="ACCURATE">ACCURATE</option>
            <option value="DATA ANALYST">DATA ANALYST</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Priority</label>
            <select id="newPriority" class="w-full border rounded-lg p-2">
              <option value="LOW">LOW</option>
              <option value="MEDIUM" selected>MEDIUM</option>
              <option value="HIGH">HIGH</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">No. WhatsApp / HP</label>
            <input id="newPhone" type="text" class="w-full border rounded-lg p-2">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Deskripsi Kendala / Permintaan</label>
          <textarea id="newDesc" rows="4" placeholder="Jelaskan detail kendala atau kebutuhan..." class="w-full border rounded-lg p-2"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Link Attachment (Google Drive - Opsional)</label>
          <input id="newAttach" type="text" placeholder="https://drive.google.com/..." class="w-full border rounded-lg p-2">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button onclick="closeModal('newModal')" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700">Batal</button>
          <button id="btnSubmitNew" onclick="submitNewTicket()" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">Kirim Tiket</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DETAIL & UPDATE TIKET -->
  <div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <div>
          <span id="editTicketNo" class="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded"></span>
          <h2 id="editModulTitle" class="font-bold text-lg mt-1"></h2>
        </div>
        <button onclick="closeModal('editModal')" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>

      <div class="bg-slate-50 p-3.5 rounded-xl text-xs space-y-1.5 mb-4 border">
        <p><span class="text-slate-500">Pemohon:</span> <b id="editUser"></b> (<span id="editDate"></span>)</p>
        <p><span class="text-slate-500">Deskripsi:</span><br><span id="editDesc" class="text-slate-700 whitespace-pre-line"></span></p>
      </div>

      <!-- PANEL KHUSUS ADMIN / ITDS -->
      <div id="itdsEditSection" class="hidden space-y-3 text-sm">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Status (State)</label>
            <select id="editState" class="w-full border rounded-lg p-2">
              <option value="New">New</option>
              <option value="In Progress">In Progress</option>
              <option value="Test & Review">Test & Review</option>
              <option value="Deployment">Deployment</option>
              <option value="Done">Done</option>
              <option value="Cancel">Cancel</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Assigned 1 (Dev/Support)</label>
            <select id="editAssign1" class="w-full border rounded-lg p-2">
              <option value="">-- Pilih --</option>
              <option value="Jenius">Jenius</option>
              <option value="Angga">Angga</option>
              <option value="Ibnu">Ibnu</option>
              <option value="Nurul">Nurul</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Assigned 2 (SA)</label>
            <select id="editAssign2" class="w-full border rounded-lg p-2">
              <option value="">-- Pilih --</option>
              <option value="Jenius">Jenius</option>
              <option value="Nurul">Nurul</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">Estimasi Selesai</label>
            <input id="editEstDone" type="datetime-local" class="w-full border rounded-lg p-2">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Ticket Level</label>
            <select id="editLevel" class="w-full border rounded-lg p-2">
              <option value="TRIVIAL">TRIVIAL</option>
              <option value="MEDIUM">MEDIUM</option>
              <option value="MAJOR">MAJOR</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">GitHub Labels (Ticket Type)</label>
            <input id="editType" type="text" placeholder="bug, enhancement" class="w-full border rounded-lg p-2">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">SA Notes</label>
          <textarea id="editSaNote" rows="2" class="w-full border rounded-lg p-2"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Dev Notes</label>
          <textarea id="editDevNotes" rows="3" class="w-full border rounded-lg p-2"></textarea>
        </div>
      </div>

      <!-- PANEL VERIFIKASI UNTUK USER BIASA -->
      <div id="userVerifySection" class="hidden space-y-3 text-sm bg-amber-50 p-4 rounded-xl border border-amber-200">
        <p class="text-xs font-bold text-amber-800">⚠️ Konfirmasi Hasil Testing</p>
        <div>
          <label class="block text-xs font-semibold mb-1">User Verification</label>
          <select id="editUserVerify" class="w-full border rounded-lg p-2 bg-white">
            <option value="">-- Pilih Status Verifikasi --</option>
            <option value="CONFIRMED">CONFIRMED (Sudah Sesuai)</option>
            <option value="INCOMPLETE">INCOMPLETE (Belum Sesuai / Revisi)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Catatan / Alasan (Jika Incomplete)</label>
          <textarea id="editUserReason" rows="2" class="w-full border rounded-lg p-2 bg-white"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-5 pt-3 border-t">
        <button onclick="closeModal('editModal')" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 text-sm">Tutup</button>
        <button id="btnSaveEdit" onclick="submitUpdateTicket()" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold text-sm">Simpan Perubahan</button>
      </div>
    </div>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP APPS SCRIPT ANDA
    const API_URL = "PASTE_URL_WEB_APP_ANDA_DISINI";

    let currentUser = JSON.parse(localStorage.getItem("itds_user"));
    let allTickets = [];
    let currentFilter = "ALL";
    let activeTicketNo = null;

    if (currentUser) showApp();

    async function apiCall(payload) {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      return await res.json();
    }

    async function handleLogin() {
      const username = document.getElementById("loginUser").value.trim();
      const password = document.getElementById("loginPass").value.trim();
      const btn = document.getElementById("btnLogin");
      btn.innerText = "Memverifikasi..."; btn.disabled = true;

      const res = await apiCall({ action: "login", username, password });
      btn.innerText = "Masuk ke Portal"; btn.disabled = false;

      if (res.status === "success") {
        currentUser = { ...res.user, password };
        localStorage.setItem("itds_user", JSON.stringify(currentUser));
        showApp();
      } else {
        document.getElementById("loginError").innerText = res.message;
      }
    }

    function logout() {
      localStorage.removeItem("itds_user");
      location.reload();
    }

    function showApp() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("appView").classList.remove("hidden");
      document.getElementById("navName").innerText = currentUser.nama;
      document.getElementById("navRole").innerText = currentUser.role;
      document.getElementById("newPhone").value = currentUser.phone || "";
      fetchTickets();
    }

    async function fetchTickets() {
      const container = document.getElementById("ticketContainer");
      container.innerHTML = `<p class="text-sm text-slate-400 col-span-full text-center py-10">Memuat daftar tiket...</p>`;
      const res = await apiCall({ action: "getTickets", username: currentUser.userId, password: currentUser.password });
      if (res.status === "success") {
        allTickets = res.tickets;
        renderTickets();
      } else {
        alert(res.message);
      }
    }

    function setFilter(status) {
      currentFilter = status;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.className = btn.innerText === (status === "ALL" ? "Semua" : status)
          ? "filter-btn bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-medium"
          : "filter-btn bg-white text-slate-600 border px-3 py-1.5 rounded-lg text-xs font-medium";
      });
      renderTickets();
    }

    function getBadgeColor(state) {
      const map = {
        "New": "bg-sky-100 text-sky-700",
        "In Progress": "bg-amber-100 text-amber-700",
        "Test & Review": "bg-purple-100 text-purple-700",
        "Deployment": "bg-indigo-100 text-indigo-700",
        "Done": "bg-emerald-100 text-emerald-700",
        "Cancel": "bg-rose-100 text-rose-700"
      };
      return map[state] || "bg-slate-100 text-slate-700";
    }

    function renderTickets() {
      const container = document.getElementById("ticketContainer");
      const filtered = currentFilter === "ALL" ? allTickets : allTickets.filter(t => t.state === currentFilter);

      if (!filtered.length) {
        container.innerHTML = `<p class="text-sm text-slate-400 col-span-full text-center py-10">Tidak ada tiket pada kategori ini.</p>`;
        return;
      }

      container.innerHTML = filtered.map(t => `
        <div onclick="openEditModal('${t.ticketNo}')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:border-blue-400 cursor-pointer transition flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <span class="text-xs font-bold text-slate-500">#${t.ticketNo} • ${t.modul}</span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${getBadgeColor(t.state)}">${t.state}</span>
            </div>
            <p class="text-sm text-slate-800 font-medium line-clamp-2 mb-3">${t.deskripsi}</p>
          </div>
          <div class="border-t pt-2.5 text-xs text-slate-500 flex justify-between items-center">
            <span>👤 ${t.nama}</span>
            <span>PIC: <b class="text-slate-700">${t.assigned1 || "-"}</b></span>
          </div>
        </div>
      `).join("");
    }

    function openNewModal() { document.getElementById("newModal").classList.replace("hidden", "flex"); }
    function closeModal(id) { document.getElementById(id).classList.replace("flex", "hidden"); }

    async function submitNewTicket() {
      const payload = {
        modul: document.getElementById("newModul").value,
        priority: document.getElementById("newPriority").value,
        phone: document.getElementById("newPhone").value,
        deskripsi: document.getElementById("newDesc").value.trim(),
        attachment: document.getElementById("newAttach").value.trim()
      };
      if (!payload.deskripsi) return alert("Deskripsi wajib diisi!");

      const btn = document.getElementById("btnSubmitNew");
      btn.innerText = "Mengirim..."; btn.disabled = true;

      const res = await apiCall({ action: "createTicket", username: currentUser.userId, password: currentUser.password, payload });
      btn.innerText = "Kirim Tiket"; btn.disabled = false;

      if (res.status === "success") {
        document.getElementById("newDesc").value = "";
        closeModal("newModal");
        fetchTickets();
      } else alert(res.message);
    }

    function openEditModal(ticketNo) {
      const t = allTickets.find(item => String(item.ticketNo) === String(ticketNo));
      if (!t) return;
      activeTicketNo = t.ticketNo;

      document.getElementById("editTicketNo").innerText = `Ticket #${t.ticketNo} (${t.state})`;
      document.getElementById("editModulTitle").innerText = t.modul;
      document.getElementById("editUser").innerText = t.nama;
      document.getElementById("editDate").innerText = t.createDate;
      document.getElementById("editDesc").innerText = t.deskripsi;

      const isITDS = currentUser.role === "Admin" || currentUser.role === "ITDS";
      document.getElementById("itdsEditSection").classList.toggle("hidden", !isITDS);
      document.getElementById("userVerifySection").classList.toggle("hidden", isITDS);

      if (isITDS) {
        document.getElementById("editState").value = t.state;
        document.getElementById("editAssign1").value = t.assigned1 || "";
        document.getElementById("editAssign2").value = t.assigned2 || "";
        document.getElementById("editEstDone").value = t.estDone || "";
        document.getElementById("editLevel").value = t.level || "TRIVIAL";
        document.getElementById("editType").value = t.ticketType || "";
        document.getElementById("editSaNote").value = t.saNote || "";
        document.getElementById("editDevNotes").value = t.devNotes || "";
      } else {
        document.getElementById("editUserVerify").value = t.userVerify || "";
        document.getElementById("editUserReason").value = t.userReason || "";
      }

      document.getElementById("editModal").classList.replace("hidden", "flex");
    }

    async function submitUpdateTicket() {
      const isITDS = currentUser.role === "Admin" || currentUser.role === "ITDS";
      const payload = { ticketNo: activeTicketNo };

      if (isITDS) {
        payload.state = document.getElementById("editState").value;
        payload.assigned1 = document.getElementById("editAssign1").value;
        payload.assigned2 = document.getElementById("editAssign2").value;
        payload.estDone = document.getElementById("editEstDone").value;
        payload.level = document.getElementById("editLevel").value;
        payload.ticketType = document.getElementById("editType").value;
        payload.saNote = document.getElementById("editSaNote").value;
        payload.devNotes = document.getElementById("editDevNotes").value;
      } else {
        payload.userVerify = document.getElementById("editUserVerify").value;
        payload.userReason = document.getElementById("editUserReason").value;
      }

      const btn = document.getElementById("btnSaveEdit");
      btn.innerText = "Menyimpan..."; btn.disabled = true;

      const res = await apiCall({ action: "updateTicket", username: currentUser.userId, password: currentUser.password, payload });
      btn.innerText = "Simpan Perubahan"; btn.disabled = false;

      if (res.status === "success") {
        closeModal("editModal");
        fetchTickets();
      } else alert(res.message);
    }
  </script>
</body>
</html>
