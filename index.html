<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <!-- HALAMAN LOGIN -->
  <div id="loginSection" class="max-w-sm mx-auto mt-16 bg-white p-6 rounded-xl shadow">
    <h2 class="text-xl font-bold text-slate-800 mb-4">Login Aplikasi</h2>
    <input id="loginUser" type="text" placeholder="Username" class="w-full border p-2.5 rounded-lg mb-3">
    <input id="loginPass" type="password" placeholder="Password" class="w-full border p-2.5 rounded-lg mb-4">
    <button onclick="login()" id="btnLogin" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700">Masuk</button>
    <p id="loginMsg" class="text-red-500 text-sm mt-3"></p>
  </div>

  <!-- HALAMAN DASHBOARD UTAMA -->
  <div id="appSection" class="max-w-4xl mx-auto hidden">
    <div class="bg-white p-4 rounded-xl shadow mb-6 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg text-slate-800">Dashboard Operasional</h1>
        <p class="text-sm text-slate-500">Halo, <span id="userNama" class="font-semibold"></span> (<span id="userRole" class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs font-bold"></span>)</p>
      </div>
      <button onclick="logout()" class="text-sm bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-lg">Keluar</button>
    </div>

    <!-- FORM INPUT (Semua Role Bisa Input) -->
    <div class="bg-white p-5 rounded-xl shadow mb-6">
      <h3 class="font-semibold text-slate-700 mb-3">Tambah Data Baru</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input id="inputKet" type="text" placeholder="Keterangan" class="border p-2 rounded-lg">
        <input id="inputNom" type="number" placeholder="Nominal" class="border p-2 rounded-lg">
        <button onclick="tambahData()" id="btnSimpan" class="bg-emerald-600 text-white rounded-lg py-2 font-medium hover:bg-emerald-700">Simpan Data</button>
      </div>
    </div>

    <!-- TABEL DATA -->
    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b text-slate-600 text-sm">
            <th class="p-3">Tanggal</th>
            <th class="p-3">Keterangan</th>
            <th class="p-3">Nominal</th>
            <th class="p-3">Input Oleh</th>
            <th class="p-3 admin-only hidden">Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y text-sm"></tbody>
      </table>
    </div>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP APPS SCRIPT ANDA
    const API_URL = "PASTE_URL_WEB_APP_ANDA_DISINI";
    let currentUser = JSON.parse(localStorage.getItem('app_user'));

    if (currentUser) initApp();

    async function callAPI(payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function login() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      const btn = document.getElementById('btnLogin');
      btn.innerText = "Memeriksa..."; btn.disabled = true;

      const res = await callAPI({ action: 'login', username, password });
      btn.innerText = "Masuk"; btn.disabled = false;

      if (res.status === 'success') {
        currentUser = { ...res.user, password };
        localStorage.setItem('app_user', JSON.stringify(currentUser));
        initApp();
      } else {
        document.getElementById('loginMsg').innerText = res.message;
      }
    }

    function logout() {
      localStorage.removeItem('app_user');
      location.reload();
    }

    function initApp() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('userNama').innerText = currentUser.nama;
      document.getElementById('userRole').innerText = currentUser.role;

      // Tampilkan kolom Aksi khusus untuk Role Admin
      if (currentUser.role === 'Admin') {
        document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
      }
      loadData();
    }

    async function loadData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">Memuat data...</td></tr>';

      const res = await callAPI({ action: 'read', username: currentUser.username, password: currentUser.password });
      if (res.status !== 'success') return alert(res.message);

      tbody.innerHTML = res.data.map(row => `
        <tr>
          <td class="p-3">${String(row.Tanggal).split('T')[0]}</td>
          <td class="p-3">${row.Keterangan}</td>
          <td class="p-3 font-medium">Rp ${Number(row.Nominal).toLocaleString('id-ID')}</td>
          <td class="p-3 text-slate-500">${row.CreatedBy}</td>
          ${currentUser.role === 'Admin' ? `<td class="p-3"><button onclick="hapusData('${row.ID}')" class="text-red-600 hover:underline">Hapus</button></td>` : ''}
        </tr>
      `).join('') || '<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada data.</td></tr>';
    }

    async function tambahData() {
      const keterangan = document.getElementById('inputKet').value;
      const nominal = document.getElementById('inputNom').value;
      if (!keterangan || !nominal) return alert("Lengkapi semua kolom!");

      const btn = document.getElementById('btnSimpan');
      btn.innerText = "Menyimpan..."; btn.disabled = true;

      const res = await callAPI({
        action: 'create',
        username: currentUser.username,
        password: currentUser.password,
        payload: { keterangan, nominal }
      });

      btn.innerText = "Simpan Data"; btn.disabled = false;
      if (res.status === 'success') {
        document.getElementById('inputKet').value = '';
        document.getElementById('inputNom').value = '';
        loadData();
      } else {
        alert(res.message);
      }
    }

    async function hapusData(id) {
      if (!confirm("Hapus data ini?")) return;
      const res = await callAPI({ action: 'delete', username: currentUser.username, password: currentUser.password, id });
      if (res.status === 'success') loadData();
      else alert(res.message);
    }
  </script>
</body>
</html>
